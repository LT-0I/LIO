# ROS runtime parameters for horizon configuration (no %YAML directive for rosparam)
# MapManager: 栅格尺寸与更新频率
#   隧道实验：map_width≈13~15、map_height≈7~9、map_depth≈7~9，可把 map_local_window 降到 40~50 减少局部点。
#   宽场景（停车场）维持 21×11×21 保守覆盖。map_skip_frame=2 在 Orin NX 下仍可 10 Hz；若 CPU 占用>80% 可调回 3，
#   若实时性不足但漂移增大，可尝试 1（配合更紧的 map_* 范围）。
map_width: 21
map_height: 11
map_depth: 21
map_local_window: 60
map_skip_frame: 2

# MapManager: 场景范围裁剪与立方体清理
#   单位米；建议显式填写避免回退到默认 cube 尺寸。
#   隧道：map_forward_range=60、map_backward_range=20、map_side_range=4、map_vertical_range=4，`enable_cube_prune: true`
#   室外：forward/backward 可放宽到 80/40，side/vertical=12~16。若 RSS 在 >350 MB 持续上涨，优先缩减这些范围。
map_forward_range: 0.0
map_backward_range: 0.0
map_side_range: 0.0
map_vertical_range: 0.0
enable_cube_prune: true

# MapManager: 局部包围盒尺寸
#   控制局部 KD-tree 采样范围。
#   隧道：local_box_forward=35~40、local_box_backward=8~10、local_box_side=4~5、local_box_vertical=3~4。
#   宽场景：side/vertical 可放到 8~10 以保更多特征。若残差数量 < 50% 阈值，再小步增加这些尺寸。
local_box_forward: 40.0
local_box_backward: 8.0
local_box_side: 8.0
local_box_vertical: 6.0

# MapManager: 局部 KD-Tree 点数上限
#   长隧道若 RSS 超 400 MB：corner 降到 150k，surf 200k，non 100k；仍高则继续 120k/160k/80k。
#   若轨迹 jitter 或 Ceres 发散，按 20k 步长回调到默认 180k/240k/120k。
local_corner_max_points: 180000
local_surf_max_points: 240000
local_non_max_points: 120000

# Estimator: 残差与特征阈值
#   隧道角点稀少：max_corner_residuals=350~400、max_surf_residuals=600~700、max_non_residuals=250~300；
#   若 `Ceres solve` >25 ms，可整体按 0.8 比例下调。feature_error_threshold=0 维持严格筛选，除非需要调试残差。
max_corner_residuals: 500
max_surf_residuals: 750
max_non_residuals: 350
feature_error_threshold: 0

# Diagnostics: 日志与统计控制
#   隧道调试保持 log_module_timing=true 便于定位瓶颈；只有需要实时观察特征数量才暂时启用 log_feature_counts，
#   否则保留 false 可减少统计开销。
log_feature_counts: false
log_module_timing: true

# CornerAdaptive: 特征保留策略
#   低纹理场景：corner_adaptive_low_feature_global_kd=60、low_feature_min_keep=220 防止角点耗尽。
#   若局部漂移，corner_adaptive_high_feature_max_keep 可升至 450~480，default_eigen_ratio 调小到 2.8 可更宽松收角点。
corner_adaptive_enable: true
corner_adaptive_default_eigen_ratio: 3.0
corner_adaptive_low_feature_eigen_ratio: 2.5
corner_adaptive_low_feature_global_kd: 80
corner_adaptive_low_feature_min_keep: 200
corner_adaptive_high_feature_global_kd: 800
corner_adaptive_high_feature_max_keep: 400

# AdaptiveBudget: 残差预算调节
#   target_build_ms / target_solve_ms 越小，Residual 删得越狠。
#   隧道实时性不足时可设 target_build_ms=6.5、target_solve_ms=20；若精度下降，把 tolerance 放宽到 0.3 并升高 min_*_residuals。
adaptive_budget_enable: true
adaptive_budget_target_build_ms: 8.0
adaptive_budget_target_solve_ms: 25.0
adaptive_budget_tolerance: 0.2
adaptive_budget_adjust_ratio: 0.15
adaptive_budget_min_corner_residuals: 200
adaptive_budget_min_surf_residuals: 450
adaptive_budget_min_non_residuals: 250

