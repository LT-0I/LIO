%YAML:1.0


# switches
Lidar_Type: 1    # 1-hap
Used_Line: 6    # lines used for lio, set to 1~6
Feature_Mode: 0    # 0(false) or 1(true)
NumCurvSize: 2
DistanceFaraway: 100 # [m]  <DistanceFaraway near / >DistanceFaraway far
NumFlat: 3 # nums of one part's flat feature
PartNum: 150 # nums of one scan's parts
FlatThreshold: 0.02 # cloud curvature threshold of flat feature
BreakCornerDis: 1 # break distance of break points
LidarNearestDis: 1.0 # if(depth < LidarNearestDis) do not use this point 
KdTreeCornerOutlierDis: 0.2 # corner filter threshold
Use_seg: 1 # use segment algorithm
map_skip_frame: 2

# map grid configuration
map_width: 21
map_height: 11
map_depth: 21
map_local_window: 60

# residual selection configuration
max_corner_residuals: 500
max_surf_residuals: 750
max_non_residuals: 350
feature_error_threshold: 1.0e-5
log_feature_counts: true
corner_adaptive_enable: true
corner_adaptive_default_eigen_ratio: 3.0
corner_adaptive_low_feature_eigen_ratio: 2.5
corner_adaptive_low_feature_global_kd: 80
corner_adaptive_low_feature_min_keep: 200
corner_adaptive_high_feature_global_kd: 800
corner_adaptive_high_feature_max_keep: 400
